<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 1 | Hello, Audio</title>
</head>
<body>
<button>Click Me</button>
    <script>
        //Complete Lab 1 here:
        //NOTE: your audio context needs to be stored in a variable called ctx
    const ctx = new AudioContext()

    let freq = 220;

    let osc = new OscillatorNode (ctx)
        osc.frequency.value = freq
        osc.connect(ctx.destination)
        osc.start()



        //Do not edit the code below here
        document.querySelector("button").onclick = () => ctx.resume();
    </script>
</body>
</html>
